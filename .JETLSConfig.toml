# JETLS configuration for MTKCircuits.jl
# MTK's @parameters and @variables macros generate Symbolics.CallAndWrap types
# that JETLS cannot type-infer through, causing false-positive inference/method-error
# diagnostics in any file using ModelingToolkit.

[[diagnostic.patterns]]
pattern = "inference/method-error"
match_by = "code"
match_type = "literal"
severity = "off"
path = "examples/**/*.jl"

[[diagnostic.patterns]]
pattern = "lowering/unused-argument"
match_by = "code"
match_type = "literal"
severity = "off"
path = "examples/**/*.jl"
